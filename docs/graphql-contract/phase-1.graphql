# Preacher scheduling module — Phase 1 (Preacher availability)
# Extracted from the real, auto-generated schema.gql after implementing this phase.
# See preacher-scheduling-blueprint/docs/01-corrected-blueprint.md for the full spec.
#
# New PermissionResolverName values gated by @Permission() on every operation below
# (see src/scripts/seed-permissions.ts and the "Preacher scheduling module" section of
# src/scripts/seed-roles.ts's Admin role):
#   myAvailability, setAvailability, setAvailabilityBulk,
#   myAvailabilityRecurrenceRules, setAvailabilityRecurrenceRule, deleteAvailabilityRecurrenceRule

type Query {
  myAvailability(month: String!): [Availability!]!
  myAvailabilityRecurrenceRules: [AvailabilityRecurrenceRule!]!
}

type Mutation {
  setAvailability(input: SetAvailabilityInput!): Availability!
  setAvailabilityBulk(input: SetAvailabilityBulkInput!): [Availability!]!
  setAvailabilityRecurrenceRule(input: SetAvailabilityRecurrenceRuleInput!): AvailabilityRecurrenceRule!
  deleteAvailabilityRecurrenceRule(id: String!): Boolean!
}

type Availability {
  id: ID!
  institution_id: String!
  user_id: String!
  date: DateTime!
  status: AvailabilityStatus!
  source: AvailabilitySource!
  recurrence_rule_id: String
  note: String
  created_at: DateTime!
  updated_at: DateTime!
  created_by: String!
  updated_by: String!
  is_deleted: Boolean!
  deleted_at: DateTime
  deleted_by: String
  institution: Institution!
  user: User!
  recurrence_rule: AvailabilityRecurrenceRule
}

type AvailabilityRecurrenceRule {
  id: ID!
  institution_id: String!
  user_id: String!
  type: RecurrenceType!
  status: AvailabilityStatus!
  day_of_week: Int
  start_date: DateTime
  end_date: DateTime
  effective_from: DateTime!
  effective_until: DateTime
  note: String
  created_at: DateTime!
  updated_at: DateTime!
  created_by: String!
  updated_by: String!
  is_deleted: Boolean!
  deleted_at: DateTime
  deleted_by: String
  institution: Institution!
  user: User!
  materialized_availabilities: [Availability!]
}

"""
MANUAL = the preacher (or an admin) set this exact date directly, always wins.
RECURRENCE_RULE = materialized from an AvailabilityRecurrenceRule; overwritten when the
rule regenerates, unless a later MANUAL edit on the same date takes precedence.
"""
enum AvailabilitySource {
  MANUAL
  RECURRENCE_RULE
}

enum AvailabilityStatus {
  AVAILABLE
  UNAVAILABLE
  VACATION
}

"""
WEEKLY covers "every Saturday available" / "never on Mondays".
DATE_RANGE covers everything from a single day off to a full month or year of vacation —
one flexible range instead of separate MONTHLY/YEARLY branches (simpler, same coverage).
"""
enum RecurrenceType {
  WEEKLY
  DATE_RANGE
}

input SetAvailabilityInput {
  date: DateTime!
  status: AvailabilityStatus!
  note: String
}

input SetAvailabilityBulkInput {
  start_date: DateTime!
  end_date: DateTime!
  status: AvailabilityStatus!
  note: String
}

"""
When id is present, updates the caller's own existing rule instead of creating a new one.
type = WEEKLY requires day_of_week and effective_from.
type = DATE_RANGE requires start_date and end_date.
"""
input SetAvailabilityRecurrenceRuleInput {
  id: String
  type: RecurrenceType!
  status: AvailabilityStatus!
  day_of_week: Int
  start_date: DateTime
  end_date: DateTime
  effective_from: DateTime
  effective_until: DateTime
  note: String
}
