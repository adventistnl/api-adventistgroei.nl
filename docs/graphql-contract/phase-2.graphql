# Preacher scheduling module — Phase 2 (Church service calendar)
# Extracted from the real, auto-generated schema.gql after implementing this phase.
# See preacher-scheduling-blueprint/docs/01-corrected-blueprint.md for the full spec.
#
# New PermissionResolverName values gated by @Permission() on every operation below
# (see src/scripts/seed-permissions.ts, and the Admin / Church Leader / Institutional
# Department Leader / Church Department Leader roles in src/scripts/seed-roles.ts):
#   churchServiceCalendar, setChurchServiceCalendar (own church — Church Leader role)
#   setChurchServiceCalendarBulk (any church — Admin + department-leader roles, R11 item E)

type Query {
  churchServiceCalendar(church_id: String!, month: String!): [ChurchServiceCalendar!]!
}

type Mutation {
  setChurchServiceCalendar(input: SetServiceCalendarInput!): [ChurchServiceCalendar!]!
  setChurchServiceCalendarBulk(input: SetServiceCalendarBulkInput!): [ChurchServiceCalendar!]!
}

type ChurchServiceCalendar {
  id: ID!
  institution_id: String!
  church_id: String!
  date: DateTime!
  has_service: Boolean!
  source: ServiceCalendarSource!
  created_at: DateTime!
  updated_at: DateTime!
  created_by: String!
  updated_by: String!
  institution: Institution!
  church: Church!
}

"""
BULK_DEFAULT = generated by an admin/department-leader bulk pattern (R8.1), shown to the
church leader as a suggestion pending confirmation. CHURCH_CONFIRMED = the leader explicitly
set or accepted it for their own church — a bulk re-apply must never silently overwrite this.
"""
enum ServiceCalendarSource {
  BULK_DEFAULT
  CHURCH_CONFIRMED
}

"""
Provide either `date` (a single point exception) or `day_of_week` + `effective_from`
(a weekly default, expanded server-side into individual rows for a rolling 12-month
horizon, or until `effective_until` if sooner). Only usable for a church you lead (R11)
— for any other church, use setChurchServiceCalendarBulk instead.
"""
input SetServiceCalendarInput {
  church_id: String!
  has_service: Boolean!
  date: DateTime
  day_of_week: Int
  effective_from: DateTime
  effective_until: DateTime
}

"""
Applies one weekly pattern to many churches at once (R8.1) — any church, not just ones
you lead. Never overwrites a date a church's own leader already confirmed
(ChurchServiceCalendar.source stays CHURCH_CONFIRMED for those).
"""
input SetServiceCalendarBulkInput {
  church_ids: [String!]!
  day_of_week: Int!
  has_service: Boolean!
  effective_from: DateTime!
  effective_until: DateTime
}
